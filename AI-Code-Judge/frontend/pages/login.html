<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI Code Judge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background: var(--bg-primary);
    }
    .auth-box {
      width: 100%;
      max-width: 420px;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo .logo-icon {
      width: 52px;
      height: 52px;
      background: var(--accent);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 12px;
      box-shadow: 0 0 24px var(--accent-glow);
    }
    .auth-logo h1 {
      font-size: 1.3rem;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .auth-logo p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
    }
    .auth-card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-card .subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .input-icon-wrap {
      position: relative;
    }
    .input-icon-wrap .form-input {
      padding-left: 38px;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      font-size: 0.85rem;
      transition: color var(--transition);
    }
    .password-toggle:hover { color: var(--text-primary); }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
    }
    #login-form .btn { width: 100%; justify-content: center; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">⚖</div>
      <h1>AI Code Judge</h1>
      <p>Your personal AI code reviewer</p>
    </div>

    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to your account to continue</p>

      <div id="login-error" class="alert alert-error hidden">
        <span>⚠</span>
        <span id="login-error-msg">Invalid email or password.</span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-icon-wrap">
            <span class="input-icon">✉</span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" class="password-toggle" id="pwd-toggle" aria-label="Toggle password visibility">👁</button>
          </div>
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" />
            Remember me
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
          Sign In
        </button>
      </form>
    </div>

    <p class="auth-footer">
      Don't have an account? <a href="register.html">Create one free</a>
    </p>
  </div>

  <div id="toast-container"></div>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
